<script src="{% static 'users/js/script.js' %}?v={{ timestamp }}"></script>
<script src="{% static 'users/js/notifications.js' %}?v={{ timestamp }}"></script>
<script src="{% static 'users/js/profile.js' %}?v={{ timestamp }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropdown = document.querySelector('.dropdown');
    const profilePic = document.querySelector('.user-profile-pic');

    if (profilePic && dropdown) {
        profilePic.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdown.classList.toggle('active');
            
            if (dropdown.classList.contains('active')) {
                document.addEventListener('click', closeDropdownOutside);
            }
        });
    }

    function closeDropdownOutside(e) {
        const dropdown = document.querySelector('.dropdown');
        const profilePic = document.querySelector('.user-profile-pic');
        
        if (dropdown && !dropdown.contains(e.target) && e.target !== profilePic) {
            dropdown.classList.remove('active');
            document.removeEventListener('click', closeDropdownOutside);
        }
    }

    document.addEventListener('click', function(e) {
        const dropdown = document.querySelector('.dropdown');
        const profilePic = document.querySelector('.user-profile-pic');
        
        if (dropdown && dropdown.classList.contains('active') && 
            !dropdown.contains(e.target) && e.target !== profilePic) {
            dropdown.classList.remove('active');
        }
    });

});
</script>
