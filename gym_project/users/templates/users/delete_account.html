{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Conferma Eliminazione Account</title>
    <link rel="stylesheet" href="{% static 'users/css/home.css' %}">
    <link rel="stylesheet" href="{% static 'users/css/delete_profile.css' %}">
</head>
<body>
    <div class="delete-account-container">
        <h1>Eliminazione Account</h1>
        <p>Sei sicuro di voler eliminare il tuo account? Questa azione è <strong>irreversibile</strong> e perderai tutti i tuoi dati.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Conferma Eliminazione</button>
            <a href="{% url 'profile' %}" class="btn-secondary">Annulla</a>
        </form>
    </div>
</body>
</html>
