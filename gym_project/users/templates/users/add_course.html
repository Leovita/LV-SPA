<div class="popup-overlay" id="add-course-popup" style="display:none;">
  <div class="popup-content">
    <div class="popup-header">
      <h2>Aggiungi Nuovo Corso/Servizio</h2>
      <button class="close-popup" onclick="closeAddCoursePopup()" aria-label="Close">&times;</button>
    </div>
    <form id="add-course-form" method="post" enctype="multipart/form-data" action="{% url 'add_course' %}">
      {% csrf_token %}
      <label>Tipo:</label>
      <select name="type" id="course-type" required>
        <option value="gym">Palestra</option>
        <option value="spa">Spa</option>
      </select>
      <label>Nome:</label>
      <input type="text" name="name" required>
      <label>Istruttore/Operatore:</label>
      <select name="instructor" id="instructor-select" required>
        {% for instructor in instructors %}
        <option value="{{ instructor.id }}">{{ instructor.full_name }}</option>
        {% endfor %}
      </select>
      <label>Descrizione:</label>
      <textarea name="description" required></textarea>
      <label>Durata (min):</label>
      <input type="number" name="duration" min="1" required>
      <div id="gym-fields">
        <label>Capacità massima:</label>
        <input type="number" name="max_partecipants" min="1">
      </div>
      <div id="spa-fields" style="display:none;">
        <label>Prezzo (€):</label>
        <input type="number" name="price" min="0" step="0.01">
        <label>Tipo trattamento:</label>
        <select name="spa_type">
          <option value="massage">Massaggio</option>
          <option value="treatment">Trattamento</option>
          <option value="ritual">Rituale</option>
        </select>
      </div>
      <label>Immagine:</label>
      <input type="file" name="image" accept="image/*" required>
      <div class="popup-actions" style="margin-top: 15px;">
        <button type="submit" class="btn btn-view">Aggiungi</button>
        <button type="button" class="btn btn-cancel" onclick="closeAddCoursePopup()">Annulla</button>
      </div>
    </form>
  </div>
</div>
<script>
document.getElementById('course-type').addEventListener('change', function() {
  if (this.value === 'gym') {
    document.getElementById('gym-fields').style.display = '';
    document.getElementById('spa-fields').style.display = 'none';
  } else {
    document.getElementById('gym-fields').style.display = 'none';
    document.getElementById('spa-fields').style.display = '';
  }
});
</script>
