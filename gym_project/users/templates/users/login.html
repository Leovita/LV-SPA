{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'users/css/auth.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Section -->
        <div class="auth-image">
            <div class="auth-image-content">
                <h2>Welcome Back</h2>
                <p>Log in to access your account or create a new one to join our community.</p>
                <img src="{% static 'users/imgs/logo.png' %}" alt="Welcome illustration">
            </div>
        </div>

        <!-- Right Section: Forms -->
        <div class="auth-forms">
            <div class="tabs">
                <div class="tab-btn active" data-tab="login" onclick="showTab('login')">Login</div>
                <div class="tab-btn" data-tab="register" onclick="showTab('register')">Register</div>
            </div>

            <!-- Login Form -->
            <div class="form-container active" id="login-form">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="login-email">Email Address</label>
                        <input name="email" type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input name="login-password" type="password" id="login-password" required>
                    </div>
                    <div class="form-footer">
                        <div class="remember-me">
                            <input name="remember-me" type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>

                <div class="social-login">
                    <p>Or login with</p>
                    <div class="social-btns">
                        <a href="#" class="social-btn" aria-label="Login with Google"><i class="fab fa-google"></i></a>
                        <a href="#" class="social-btn" aria-label="Login with Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="social-btn" aria-label="Login with Apple"><i class="fab fa-apple"></i></a>
                    </div>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-container" id="register-form">
                <form method="POST" action="{% url 'register' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="register-name">Full Name</label>
                        <input name="register-name" type="text" id="register-name" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email Address</label>
                        <input name="register-email" type="email" id="register-email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input name="register-password" type="password" id="register-password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm">Confirm Password</label>
                        <input name="register-confirm" type="password" id="register-confirm" required>
                    </div>
                    <div class="remember-me">
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the Terms and Conditions</label>
                    </div>
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>

                <div class="social-login">
                    <p>Or register with</p>
                    <div class="social-btns">
                        <a href="#" class="social-btn" aria-label="Register with Google"><i class="fab fa-google"></i></a>
                        <a href="#" class="social-btn" aria-label="Register with Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a href="#" class="social-btn" aria-label="Register with Apple"><i class="fab fa-apple"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        function getTabFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('tab');
        }

        function showTab(tabName) {
            document.querySelectorAll('.form-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`${tabName}-form`)?.classList.add('active');
            document.querySelector(`.tab-btn[data-tab="${tabName}"]`)?.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', function () {
            const tab = getTabFromURL();
            showTab(tab || 'login');
        });
    </script>
</body>
</html>
